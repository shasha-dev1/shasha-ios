name: ShashaIOS
options:
  bundleIdPrefix: app.shasha
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ar
packages:
  # mpv engine: libmpv + FFmpeg + libplacebo (Dolby Vision) + libass, LGPL build.
  # 0.9.3: local copy made by CI (scripts/vendor-mpvkit.sh): MPVKit 1.1.0-n9.0.2 with our own libmpv build that
  # adds the avfoundation video output (picture in picture). Everything else still comes from MPVKit's release.
  MPVKit:
    path: vendor/MPVKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.9.7"
    CURRENT_PROJECT_VERSION: "8"
targets:
  ShashaIOS:
    type: application
    platform: iOS
    dependencies:
      - package: MPVKit
        product: MPVKit
    sources:
      - Sources
      - Resources
      - Logic/Sources/PlaybackLogic
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: "شاشة"
        # Without these XcodeGen writes fixed "1.0" / "1" into Info.plist.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar, en]
        UILaunchScreen: {}
        ShashaCredit: "$(SHASHA_CREDIT)"
        NSFaceIDUsageDescription: "لفتح المجموعات التي قفلتها في شاشة."
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "للوصول إلى خوادم القوائم على الشبكة المحلية."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shasha.ios
        PRODUCT_NAME: ShashaIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/PiP/Shasha-Bridging-Header.h
        # 0.8.9: MPVKit's static libraries go BEFORE the CocoaPods flags (-framework VLCKit). VLCKit is a dynamic
        # framework that exports its own libplacebo; with VLCKit first, ld bound part of mpv's libplacebo calls to
        # VLCKit's copy (device backtrace: pl_tex_create/pl_upload_plane inside "VLCKit", pl_queue_update inside the
        # app) — two libplacebo versions mixed. CI checks the result with nm (no mpv-library symbol from VLCKit).
        OTHER_LDFLAGS: "-framework Libmpv -framework Libplacebo -framework Libdovi -framework Libshaderc_combined -framework lcms2 -framework Libavcodec -framework Libavdevice -framework Libavfilter -framework Libavformat -framework Libavutil -framework Libswresample -framework Libswscale -framework Libass -framework Libfreetype -framework Libfribidi -framework Libharfbuzz -framework Libunibreak -framework Libssl -framework Libcrypto -framework gmp -framework nettle -framework hogweed -framework gnutls -framework Libdav1d -framework Libuavs3d -framework Libuchardet -framework Libbluray -lMoltenVK $(inherited)"
        SHASHA_CREDIT: ""
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_BITCODE: "NO"
