name: Build IPA (unsigned)

on:
  push:
    branches: [main, "work/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 100
    env:
      SHASHA_CREDIT: ${{ secrets.SHASHA_CREDIT }}
      MPVKIT_TAG: 1.1.0-n9.0.2
    steps:
      - uses: actions/checkout@v4

      # libmpv with the avfoundation video output (picture in picture), built from MPVKit's own scripts.
      # Rebuilt only when the patches, the script or the MPVKit tag change.
      - name: Cache patched libmpv
        id: libmpv-cache
        uses: actions/cache@v4
        with:
          path: .libmpv
          key: libmpv-${{ env.MPVKIT_TAG }}-${{ hashFiles('patches/libmpv/**', 'scripts/build-libmpv.sh') }}

      - name: Build patched libmpv
        id: libmpv
        if: steps.libmpv-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          scripts/build-libmpv.sh "$MPVKIT_TAG" .libmpv 2>&1 | tee libmpv.log | tail -40

      - name: Build
        id: build
        run: |
          set -o pipefail
          {
            echo "== xcode"; xcodebuild -version
            echo "== unit tests (PlaybackLogic)"
            swift test --package-path Logic
            echo "== vendor MPVKit with the patched libmpv"
            scripts/vendor-mpvkit.sh "$MPVKIT_TAG" .libmpv
            brew install xcodegen
            xcodegen generate
            xcodebuild -project ShashaIOS.xcodeproj -scheme ShashaIOS -configuration Release \
              -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SHASHA_CREDIT="$SHASHA_CREDIT" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" build
          } 2>&1 | tee all.log

      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ShashaIOS.app Payload/
          zip -qry Shasha-unsigned.ipa Payload
          ls -la Shasha-unsigned.ipa
          # 1.0.0: VLC removed — the app must not link any VLCKit/libVLC.
          B=build/Build/Products/Release-iphoneos/ShashaIOS.app/ShashaIOS
          { echo "== linked VLC (must be 0)"; otool -L "$B" | grep -ci vlc;
            ls build/Build/Products/Release-iphoneos/ShashaIOS.app/Frameworks 2>/dev/null | grep -ci vlc; } > symbols.txt 2>&1 || true
          cat symbols.txt

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: Shasha-unsigned-ipa
          path: Shasha-unsigned.ipa
          retention-days: 3

      # Short result + errors on the ci-logs branch (read by the developer with git, no API needed).
      - name: Publish build summary
        if: always()
        run: |
          {
            echo "run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA outcome=${{ steps.build.outcome }} libmpv=${{ steps.libmpv.outcome || 'cached' }}"
            if [ -f libmpv.log ]; then echo "== libmpv (tail)"; grep -E "error|Error|FAILED|ERROR|Built " libmpv.log | tail -30; tail -15 libmpv.log; fi
            plutil -p build/Build/Products/Release-iphoneos/ShashaIOS.app/Info.plist 2>/dev/null | grep -E "CFBundle(ShortVersionString|Version)\"" || true
            cat symbols.txt 2>/dev/null || true
            echo "== size"; ls -la Shasha-unsigned.ipa 2>/dev/null || true; du -sh build/Build/Products/Release-iphoneos/ShashaIOS.app 2>/dev/null || true
            echo "== errors"; grep -E "error:|fatal error|Undefined symbol|ld: |\*\* BUILD|\[!\]|failed \(|Executed [0-9]+ test" all.log | head -200 || true
            echo "== tail"; tail -60 all.log || true
          } > ci-summary.txt
          git config user.name "shasha-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf --cached . > /dev/null
          git add -f ci-summary.txt
          git commit -qm "build $GITHUB_RUN_NUMBER: ${{ steps.build.outcome }}"
          git push -qf origin HEAD:ci-logs
